apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-flask-deployment
  namespace: hello-flask
  labels:
    app: hello-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-flask
  template:
    metadata:
      labels:
        app: hello-flask
    spec:
      imagePullSecrets:
        - name: ghcr-secret      # <-- REQUIRED for private GHCR image
      containers:
        - name: hello-flask
          image: ghcr.io/arshiya1305/hello-flask:1.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

